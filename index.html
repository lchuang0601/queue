<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Queue Challenge｜佇列闖關</title><style>body{font-family:system-ui,'Microsoft JhengHei',sans-serif;background:#eef4fa;color:#172b45;margin:0}main{max-width:1050px;margin:auto;padding:16px}header,.panel{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #17385a12}h1{margin:0 0 8px;font-size:1.7rem}h2{margin:0 0 12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:14px}.levels{display:flex;gap:7px;flex-wrap:wrap}.levels button{flex:1;min-width:90px}button{border:0;border-radius:10px;padding:12px 14px;font-size:1rem;font-weight:700;background:#dfe9f6;color:#123e6a;cursor:pointer}button.primary{background:#1765c1;color:white}button:disabled{opacity:.4;cursor:not-allowed}input{padding:12px;border:1px solid #b6c8db;border-radius:10px;font-size:1rem;max-width:100%}.slots{display:flex;gap:7px;margin:22px 0 10px}.slot{flex:1;min-width:0;min-height:76px;border:2px solid #b5c9df;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#f6f9fd}.slot strong{font-size:1.35rem}.slot small{font-size:.72rem;color:#63778c}.slot.front{border-color:#15803d}.slot.rear{box-shadow:inset 0 0 0 2px #f59e0b}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.controls button{flex:1;min-width:135px}.muted{color:#5a6b7d}.message{min-height:45px;padding:10px;border-radius:10px;background:#e9f2fc;margin-top:12px}.score{font-size:2.4rem;font-weight:800;color:#1765c1}.pill{background:#e9f2fc;border-radius:30px;padding:7px 12px;display:inline-block;margin:4px}.certificate{text-align:center;border:2px dashed #9db8d8;border-radius:16px;padding:16px;margin-top:16px;background:#f8fbff}.certificate h2{color:#1765c1}.hide{display:none}@media(max-width:680px){.layout{grid-template-columns:1fr}.slots{gap:3px}.slot{min-height:65px}.slot strong{font-size:1rem}main{padding:8px}header,.panel{padding:12px}.controls button{min-width:100px}h1{font-size:1.4rem}}@media(orientation:landscape) and (max-height:500px){header,.panel{padding:10px;margin-bottom:8px}.slots{margin:9px 0}.slot{min-height:55px}}.slot.pickable{cursor:pointer;border:2px solid #3b82f6;transition:transform .15s}.slot.pickable:hover{transform:translateY(-3px);background:#dbeafe}.slot.pickable:focus{outline:3px solid #f59e0b}.hintbox{padding:14px;margin-top:10px;border-radius:12px;background:#fff2d5;border:1px solid #e9b35b;color:#643d0b;line-height:1.7}.hintbox strong{display:block;margin-bottom:4px}.slot.wrong{background:#fee2e2!important;border-color:#dc2626!important}.task-alert{background:#fff0f0;border:2px solid #dc2626;border-radius:12px;padding:13px;color:#991b1b;font-weight:800;font-size:1.13rem;line-height:1.6}.task-alert strong{color:#b91c1c}.message.error{background:#fee2e2;border:2px solid #dc2626;color:#991b1b}.message.success{background:#dcfce7;border:1px solid #16a34a;color:#166534}.slot.pickable{border-color:#2563eb}.choice-tip{font-size:.9rem;color:#555;margin:8px 0}.quiz-buttons{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0}.quiz-buttons button{text-align:left;white-space:normal;line-height:1.5;background:#fff;border:1px solid #d9b26c}.quiz-buttons button:hover{background:#ffedc6}.hintbox p{margin:9px 0}</style></head><body><main><header><h1>🚦 Queue Challenge｜佇列闖關</h1><div class="muted">三種佇列 × 五關挑戰｜操作正確才能過關｜滿分 100 分</div><p>學生姓名：<input id="student" placeholder="請輸入真實姓名" maxlength="30"> <button id="start" class="primary">開始挑戰</button></p></header><div class="layout"><section><div class="panel"><div class="levels" id="levels"></div></div><div class="panel"><h2 id="title">請先輸入姓名並開始</h2><p id="intro" class="muted">每關依序完成指定操作。系統會即時顯示佇列變化。</p><div id="task"></div><div class="slots" id="slots"></div><p id="pointers" class="muted"></p><div class="controls" id="controls"></div><div class="message" id="message" aria-live="polite">準備好了就開始吧！</div></div></section><aside class="panel"><h2>即時成績</h2><div id="score" class="score">0 / 100</div><div id="nameview">姓名：尚未設定</div><div id="progress"></div><hr><p class="muted">每關 20 分；已完成關卡的分數立即保留。</p><button id="reset" style="width:100%">重新挑戰</button></aside></div><div id="certificate" class="panel certificate hide"><h2>Queue Challenge 成績單</h2><h3 id="certname"></h3><div class="score" id="certscore"></div><p id="certlevels"></p><p class="muted">請將姓名、成績與完成關卡一起截圖，上傳 Moodle。</p></div></main><script>
const defs=[{title:'第 1 關｜一般佇列：基本操作',mode:'linear',desc:'初始 Front = Rear = -1。先依序 Enqueue(10)、Enqueue(20)、Enqueue(30)，接著兩次 Dequeue 都要由你親自點選正確的資料格；點錯會出現觀念提示，可重試。',steps:[['enq',10],['enq',20],['enq',30],['deq',10],['deq',20]]},{title:'第 2 關｜一般佇列：假溢位',mode:'linear',desc:'容量 5。先放滿、移除前兩筆，再親自嘗試 Enqueue(20)，觀察失敗原因並回答問題。',steps:[['enq',1],['enq',2],['enq',3],['enq',4],['enq',5],['deq',1],['deq',2],['blockedEnq',20]]},{title:'第 3 關｜環狀佇列：繞回',mode:'circular',desc:'操作 Enqueue(60) 觀察 Rear 繞回索引 0；接著嘗試 Enqueue(33)，回答為什麼必須保留一格空間。',steps:[['enq',10],['enq',20],['enq',30],['enq',40],['deq',10],['deq',20],['enq',50],['enq',60],['blockedCircularEnq',33]]},{title:'第 4 關｜環狀佇列：滿與空',mode:'circular',desc:'容量 5，採保留一格的環狀佇列：最多存 4 筆。觀察 Full、Empty 與 Dequeue 後的變化。',steps:[['empty'],['enq',1],['enq',2],['enq',3],['enq',4],['full'],['deq',1],['notfull']]},{title:'第 5 關｜雙端佇列 Deque',mode:'deque',desc:'練習從前後兩端加入與移除資料。',steps:[['back',10],['back',20],['front',5],['popback',20],['popfront',5],['front',3]]}];
let active=-1,step=0,queue=[],front=-1,rear=-1,count=0,passed=[false,false,false,false,false],locked=false,pendingFullQuestion=false,pendingCircularQuestion=false,circularQuizStage=0,fullQuizStage=0;const $=id=>document.getElementById(id);function name(){return $('student').value.trim()}function label(op){let [t,v]=op;return ({enq:`Enqueue(${v})`,deq:`Dequeue() → ${v}`,full:'判斷：目前不能再 Enqueue（Full）',empty:'判斷：目前是 Empty',notfull:'判斷：目前不是 Full',wrap:'判斷：Rear 已繞回索引 0',blockedEnq:`Enqueue(${v})`,blockedCircularEnq:`Enqueue(${v})`,back:`addLast(${v})`,front:`addFirst(${v})`,popback:`removeLast() → ${v}`,popfront:`removeFirst() → ${v}`})[t]}function isPickStep(){return ['deq','popfront','popback'].includes(defs[active]?.steps[step]?.[0])}function buttons(){
 let ops=defs[active].mode==='deque'?[['front',5],['front',3],['back',10],['back',20],['popfront',null],['popback',null]]:[['enq',10],['enq',20],['enq',30],['enq',40],['enq',50],['enq',60],['enq',33],['enq',88],['enq',1],['enq',2],['enq',3],['enq',4],['enq',5],['deq',null],['empty'],['full'],['notfull'],['wrap']];
 let t=defs[active].steps[step]?.[0];
 if(t==='enq'||t==='blockedEnq'||t==='blockedCircularEnq')ops=ops.filter(o=>o[0]==='enq');
 else if(['empty','full','notfull','wrap'].includes(t))ops=ops.filter(o=>['empty','full','notfull','wrap'].includes(o[0]));
 else if(defs[active].mode==='deque')ops=ops.filter(o=>o[0]==='front'||o[0]==='back');
 if(t==='blockedEnq')ops=[['enq',20]];
 if(t==='blockedCircularEnq')ops=[['enq',33]];
 return ops.map(o=>`<button data-op="${o[0]}" data-val="${o[1]??''}">${o[0]==='enq'?'Enqueue('+o[1]+')':o[0]==='deq'?'Dequeue()':label(o)}</button>`).join('')
}
function showError(type,val,expected){
 let mode=defs[active].mode;
 let detail='請先閱讀紅色任務，確認要執行的操作與數值。';
 if(mode==='linear')detail='一般佇列採 FIFO；Front 指向第一筆有效資料前一格。刪除時 Front 先加 1，Rear 不變。一般佇列的 Rear 到達最後一格時，即使前面有空格，也不能直接從尾端加入。';
 if(mode==='circular')detail='本遊戲的環狀佇列採「保留一格」方式：容量 5 最多放 4 筆。Rear 使用 (Rear+1) % 5 繞回；若下一個 Rear 會與 Front 重合，表示 Full。';
 if(mode==='deque')detail='雙端佇列可以從前端或後端新增與刪除；addFirst 放前面、addLast 放後面，removeFirst 刪前端、removeLast 刪後端。';
 $('message').className='message error';
 $('message').innerHTML='<strong>❌ 操作不正確，請再試一次！</strong><div>'+detail+'</div><div>本次不扣分，資料不變。</div>';
}
function circularQuestionHTML(){
 if(circularQuizStage===0)return `<div class="hintbox"><strong>🔍 觀察與預測：如果強行把 33 放入 index 1，Rear 將變成多少？</strong><p>現在 Front = 1、Rear = 0。請自己算算 (Rear + 1) % 5。</p><div class="quiz-buttons"><button data-circular-answer="a">A. Rear = 0</button><button data-circular-answer="b">B. Rear = 1</button><button data-circular-answer="c">C. Rear = 2</button></div><p class="choice-tip">先選出新 Rear，才進入下一題。此處只是模擬，不會真的放入 33。</p></div>`;
 return `<div class="hintbox"><strong>🧠 觀念挑戰：若強行放入 33，會變成 Front = 1、Rear = 1。為什麼要保留 index 1 不使用？</strong><p>請比較「佇列完全清空」與「強行放入第 5 筆資料」兩種情況下，Front、Rear 會不會相同。</p><div class="quiz-buttons"><button data-circular-answer="d">A. 因為數值 33 太大</button><button data-circular-answer="e">B. 因為 Rear = Front 會與 Empty 的判斷條件相同，無法辨識 Full 與 Empty</button><button data-circular-answer="f">C. 因為 Rear 繞回 index 0 後，不能再使用 index 1</button></div><p class="choice-tip">請選擇正確原因；答對才完成第三關。</p></div>`;
}
function fullQuestionHTML(){
 if(fullQuizStage===0)return `<div class="hintbox"><strong>❓ 問題一：Enqueue(20) 失敗了！請觀察目前的 Front、Rear。</strong><p>容量 5，索引為 0～4。現在 Front = 1、Rear = 4。雖然 index 0、1 有空格，為什麼不能新增？</p><div class="quiz-buttons"><button data-answer="a">A. 因為 Queue 已經沒有資料</button><button data-answer="b">B. 因為一般佇列的 Rear 已在最後一格，不能繞回前方空格</button><button data-answer="c">C. 因為只要 Front = 1，就表示 Queue 已滿</button></div></div>`;
 return `<div class="hintbox"><strong>❓ 問題二：目前 Queue 只有 3 筆資料，為何仍不能 Enqueue(20)？</strong><div class="quiz-buttons"><button data-answer="d">A. 因為一般佇列的陣列容量實際上只有 3</button><button data-answer="e">B. 這是假溢位：前方有空位，但一般佇列的 Rear 無法再往後移動</button><button data-answer="f">C. 因為 Dequeue 之後不能再 Enqueue</button></div><p class="choice-tip">兩題都答對，才完成第二關。答錯不扣分，可重新選擇。</p></div>`;
}
function render(){if(active<0)return;$('title').textContent=defs[active].title;$('intro').textContent=defs[active].desc;$('task').innerHTML=step<defs[active].steps.length?`<div class="task-alert"><strong>🔴 任務 ${step+1}/${defs[active].steps.length}：</strong>${isPickStep()?(defs[active].mode==='deque'?(defs[active].steps[step][0]==='popback'?'removeLast()':'removeFirst()'):'Dequeue'):label(defs[active].steps[step])}</div>`:'<div class="task-alert">本關完成！</div>';$('controls').innerHTML=pendingCircularQuestion?circularQuestionHTML():pendingFullQuestion?fullQuestionHTML():step<defs[active].steps.length?(isPickStep()?'':buttons()):'';let mode=defs[active].mode,html='';for(let i=0;i<5;i++){let val=mode==='deque'?queue[i]:queue[i];html+=`<div ${isPickStep()?`role="button" tabindex="0" data-slot="${i}" aria-label="選擇索引 ${i} 的資料"`:''} class="slot ${isPickStep()?'pickable ':''}${mode!=='deque'&&count>0&&i===(front+1)%5?'front':''} ${mode!=='deque'&&count>0&&i===rear?'rear':''}"><small>index ${i}</small><strong>${val===undefined?'－':val}</strong></div>`}$('slots').innerHTML=html;$('pointers').textContent=mode==='deque'?`目前內容（左為前端）：[${queue.join(', ')}]　共 ${queue.length} 筆`:`Front = ${front}（第一筆前一格）｜ Rear = ${rear} ｜ count = ${count} ｜ 容量 = 5`;$('score').textContent=passed.filter(Boolean).length*20+' / 100';$('nameview').textContent='姓名：'+name();$('progress').innerHTML=passed.map((x,i)=>`<p>${x?'✅':'○'} 第 ${i+1} 關：${x?20:0} 分</p>`).join('');$('levels').innerHTML=defs.map((d,i)=>`<button ${i!==active?'disabled':''} class="${i===active?'primary':''}">${passed[i]?'✓ ':''}第 ${i+1} 關</button>`).join('');$('certname').textContent='學生姓名：'+name();$('certscore').textContent='總分：'+passed.filter(Boolean).length*20+' / 100';$('certlevels').textContent=passed.map((v,i)=>`第${i+1}關 ${v?'完成':'未完成'}`).join('｜');$('certificate').classList.remove('hide');document.querySelectorAll('[data-slot]').forEach(el=>{let choose=()=>pickDelete(Number(el.dataset.slot));el.addEventListener('click',choose);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}})});document.querySelectorAll('[data-circular-answer]').forEach(b=>b.addEventListener('click',()=>answerCircular(b.dataset.circularAnswer)));document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>answerBlocked(b.dataset.answer)));document.querySelectorAll('[data-op]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.op,b.dataset.val===''?null:Number(b.dataset.val))))}
function pickDelete(index){
 if(!isPickStep()||locked)return;
 const mode=defs[active].mode; const operation=defs[active].steps[step][0]; const correct=mode==='deque'?(operation==='popback'?queue.length-1:0):(mode==='circular'?(front+1)%5:front+1);
 const value=queue[index];
 if(index!==correct){
   const msg=mode==='deque'?'雙端佇列可以從兩端刪除，但必須依任務選擇正確的前端或後端。':index<=front
     ?'這一格已經在 Front 的位置或其前方，不是目前佇列的第一筆有效資料。'
     :'Queue 是 FIFO（先進先出），不能跳過前面的資料，直接刪除後面這一格。';
   $('message').className='message error';$('message').innerHTML='<div class="hintbox"><strong>❌ 選錯了！請直接點選佇列中，這次應該刪除的資料格。</strong><br>'+msg+'<br>觀念提示：Front 指向「第一筆有效資料的前一格」，所以 Dequeue 時應先讓 Front 往後移動一格，再取出該格資料。<br>目前 Front = '+front+'，Rear = '+rear+'。答錯不扣分，也不會改變佇列。</div>';
   const el=document.querySelector(`[data-slot="${index}"]`);if(el){el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),800)}
   return;
 }
 act(operation,null);
}
function answerCircular(choice){
 if(!pendingCircularQuestion||locked)return;
 if(circularQuizStage===0){
  if(choice!=='b'){
   $('message').className='message error';
   $('message').innerHTML='<strong>❌ 再算一次！</strong><div>環狀佇列索引採用 (Rear + 1) % 5。現在 Rear = 0，下一格會是哪個 index？</div><div>可以重新選擇，不扣分，也不會變更資料。</div>';
   return;
  }
  circularQuizStage=1;
  $('message').className='message success';
  $('message').innerHTML='<strong>✅ 正確！</strong>如果真的加入 33，Rear 將從 0 變成 1，恰好與 Front = 1 相同。接著回答：這為什麼會造成問題？';
  render();return;
 }
 if(choice!=='e'){
  $('message').className='message error';
  $('message').innerHTML='<strong>❌ 還不正確，可以再試一次！</strong><div>在本關的演算法中，Front = Rear 用來表示 Empty。如果放入 33 後 Rear 也變成 1，程式還能只靠 Front、Rear 區分空與滿嗎？</div><div>資料保持不變，不扣分。</div>';
  return;
 }
 pendingCircularQuestion=false;circularQuizStage=0;
 $('message').className='message success';
 $('message').innerHTML='<strong>🎉 答對了！</strong>如果把 33 放進 index 1，Rear 就會變成 1，與 Front = 1 相同。在這個只用 Front、Rear 判斷的版本中，Front = Rear 原本代表 Empty；若再放入第 5 筆，Rear = Front = 1，實際上是 Full，卻會被誤判成 Empty。因此必須保留 index 1 這一格，讓 (Rear + 1) % 5 = Front 代表 Full，而 Front = Rear 代表 Empty。<br><small>補充：若另用 count 或 Tag，則可以採用不保留一格的設計。</small>';
 finishStep();
}
function finishStep(){
 step++;
 if(step===defs[active].steps.length){passed[active]=true;locked=true;render();let b=document.createElement('button');b.className='primary';b.textContent=active===4?'全部完成！':'進入下一關 →';b.onclick=()=>{if(active<4){active++;step=0;queue=[];front=-1;rear=-1;count=0;locked=false;pendingFullQuestion=false;pendingCircularQuestion=false;circularQuizStage=0;fullQuizStage=0;$('message').className='message';$('message').textContent='新關卡開始！';render()}};$('controls').appendChild(b)}else render();
}
function answerBlocked(choice){
 if(!pendingFullQuestion||locked)return;
 const right=fullQuizStage===0?'b':'e';
 if(choice!==right){
  $('message').className='message error';
  $('message').innerHTML=fullQuizStage===0?'<strong>❌ 再想想！</strong><div>一般佇列不會繞回前面的空格。請觀察 Rear = 4，已是容量 5 的最後索引。</div><div>請重新選擇，資料不變，也不扣分。</div>':'<strong>❌ 還不正確，請再試一次！</strong><div>Front = 1、Rear = 4，只有 3 筆有效資料，卻無法再新增，這種現象叫什麼？</div><div>本次不扣分。</div>';
  return;
 }
 if(fullQuizStage===0){
  fullQuizStage=1;
  $('message').className='message success';
  $('message').innerHTML='<strong>✅ 第一題答對！</strong>一般佇列的 Rear 已到最後一格，即使前面有空位，也不能回頭使用。再回答第二題。';
  render();return;
 }
 pendingFullQuestion=false;fullQuizStage=0;
 $('message').className='message success';
 $('message').innerHTML='<strong>🎉 兩題都答對！</strong>這是「假溢位」：陣列前面仍有空格，但一般佇列 Rear = 4，無法再向後新增。這也是環狀佇列能改善的問題。第二關完成，獲得 20 分。';
 finishStep();
}
function act(type,val){if(locked||pendingFullQuestion||pendingCircularQuestion)return;let expected=defs[active].steps[step];if(!expected)return;if(expected[0]==='blockedCircularEnq'){
 if(type!=='enq'||val!==33){showError(type,val,expected);return}
 if(defs[active].mode!=='circular'||count!==4||rear!==0||front!==1){showError(type,val,expected);return}
 pendingCircularQuestion=true;circularQuizStage=0;
 $('message').className='message error';
 $('message').innerHTML='<strong>⚠️ Enqueue(33) 無法執行！</strong><div>此時下一格 index 1 必須保留。請回答下方兩題，答對才能過關；33 不會真的加入佇列。</div>';
 render();return;
 }
